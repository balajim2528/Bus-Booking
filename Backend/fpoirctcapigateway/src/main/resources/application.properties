eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=irctc-api
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://irctc-api
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/irctc/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1


spring.cloud.gateway.server.webmvc.cors.allowed-origins=http://localhost:4200
spring.cloud.gateway.server.webmvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webmvc.cors.allowed-headers=*
spring.cloud.gateway.server.webmvc.cors.allow-credentials=true
